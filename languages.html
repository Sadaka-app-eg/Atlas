<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS | مسارات اللغات الأجنبية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./kemet-theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#090A0F] text-slate-100 antialiased min-h-screen py-8 px-4 md:px-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- زر الرجوع للرئيسية وشريط العنوان -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <a href="index.html" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#11131A] border border-slate-800 hover:border-slate-700 text-xs font-bold text-slate-300 transition no-underline">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة للرئيسية</span>
      </a>
      <div id="currentLangBadge" class="text-xs font-mono font-bold px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">
        LANGUAGE TRACK
      </div>
    </div>

    <!-- كبسولات اختيار المستوى A1, A2, B1, B2... -->
    <div id="languageLevelsNav" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

    <!-- حقل البحث السريع في بنك الكلمات والجمل -->
    <div class="relative">
      <input id="langSkillsSearchInput" oninput="filterLangCardsLive()" type="text" placeholder="🔎 ابحث عن فعل، كلمة، قاعدة، محادثة..." class="w-full h-12 rounded-2xl px-5 border border-slate-700 bg-[#11131A] text-xs text-white placeholder:text-slate-500 focus:border-cyan-400 outline-none transition" />
    </div>

    <!-- شبكة بوابات المهارات العشر -->
    <div id="langCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- يتم توليد البطاقات ديناميكياً بناءً على المستوى واللغة المختارة -->
    </div>

    <!-- قائمة المحاضرات والاختبارات التابعة للمستوى -->
    <div class="space-y-3 pt-4 border-t border-slate-800">
      <h3 class="font-bold text-sm text-slate-200">المحاضرات والشروحات التأسيسية</h3>
      <div id="languageLessonsList" class="space-y-2"></div>
    </div>

  </div>

  <!-- المودال الخاص بعرض المحتوى مع النطق الصوتي -->
  <div id="resourceFullModal" class="hidden fixed inset-0 z-[500] flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-3xl max-w-4xl w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-base sm:text-lg font-black text-white" id="resourceModalTitle"></h3>
          <span class="text-[11px] text-slate-400 font-bold" id="resourceModalSubtitle"></span>
        </div>
        <button onclick="closeResourceModal()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition cursor-pointer">✕</button>
      </div>
      <div id="resourceModalList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
    </div>
  </div>

  <!-- استدعاء ملف البيانات الخاص باللغات -->
  <script src="./languages-data.js"></script>
  <script>
    // قراءة الكورس المطلوب من رابط الصفحة (مثلاً ?course=c_english_all)
    const urlParams = new URLSearchParams(window.location.search);
    const activeCourse = urlParams.get('course') || 'c_english_all';
    
    // منطق تبديل المستويات وعرض البيانات
    // (يتم استدعاء بيانات deutschMasterCurriculum أو courseResourcesMaster من languages-data.js)
  </script>
</body>
</html>
